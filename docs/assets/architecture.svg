<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica,Arial,sans-serif">
  <rect width="980" height="560" fill="#f8fafc"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">System Architecture</text>

  <!-- Input -->
  <rect x="40" y="70" width="230" height="90" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="155" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Input Layer</text>
  <text x="155" y="130" text-anchor="middle" font-size="12" fill="#334155">Ring image + parameters</text>
  <text x="155" y="148" text-anchor="middle" font-size="12" fill="#334155">size (IN / US), karat, stones</text>

  <!-- CLIP -->
  <rect x="330" y="70" width="200" height="90" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="430" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">CLIP Encoder</text>
  <text x="430" y="130" text-anchor="middle" font-size="12" fill="#334155">image → 512-d vector</text>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#334155">open_clip ViT-B/32</text>

  <!-- Vector DB -->
  <rect x="610" y="70" width="200" height="90" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="710" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Vector DB</text>
  <text x="710" y="130" text-anchor="middle" font-size="12" fill="#334155">Pinecone / Chroma</text>
  <text x="710" y="148" text-anchor="middle" font-size="12" fill="#334155">top-5 similar designs</text>

  <!-- arrows input->clip->vdb -->
  <path d="M270 115 L330 115" stroke="#f2b705" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M530 115 L610 115" stroke="#f2b705" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#f2b705"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- LLM -->
  <rect x="330" y="230" width="480" height="110" rx="14" fill="#fff8e1" stroke="#0f172a" stroke-width="2"/>
  <text x="570" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">LLM — Weight-First Visual RAG</text>
  <text x="570" y="294" text-anchor="middle" font-size="12.5" fill="#334155">Gemini 3.1 Flash · Claude Sonnet — real catalog weights injected as few-shot anchors</text>
  <text x="570" y="318" text-anchor="middle" font-size="12.5" fill="#334155">predicts 18K gold mass directly (g), avoiding the mm³ "Abstract Unit Trap"</text>

  <path d="M710 160 L710 200 L570 200 L570 230" stroke="#f2b705" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M155 160 L155 260 L330 260" stroke="#f2b705" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Physics -->
  <rect x="60" y="230" width="200" height="110" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="160" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Physics Layer</text>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#334155">V = W₁₈ₖ / 0.01558</text>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#334155">14K · 18K · 22K densities</text>
  <text x="160" y="332" text-anchor="middle" font-size="12" fill="#334155">dual ring-size scaling</text>

  <path d="M330 285 L260 285" stroke="#0f172a" stroke-width="2.5" fill="none" marker-end="url(#g)"/>

  <!-- Output -->
  <rect x="330" y="400" width="480" height="86" rx="14" fill="#0f172a"/>
  <text x="570" y="434" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#f2b705">Predicted weights · min–max range · 3-decimal precision</text>
  <text x="570" y="462" text-anchor="middle" font-size="12.5" fill="#e2e8f0">e.g. 18K 3.412 g · 14K 2.845 g · 22K 3.830 g</text>

  <path d="M570 340 L570 400" stroke="#0f172a" stroke-width="2.5" fill="none" marker-end="url(#g)"/>

  <!-- Feedback loop -->
  <rect x="60" y="400" width="200" height="86" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="160" y="434" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Human Feedback</text>
  <text x="160" y="458" text-anchor="middle" font-size="12" fill="#334155">verified / corrected →</text>
  <text x="160" y="476" text-anchor="middle" font-size="12" fill="#334155">re-ingested into RAG</text>

  <path d="M330 443 L260 443" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#g)"/>
  <path d="M160 400 L160 360 Q160 345 175 345 L710 345 Q725 345 725 330 L725 160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" fill="none"/>

  <text x="490" y="536" text-anchor="middle" font-size="11.5" fill="#64748b">FastAPI · React (Vite + TS + Tailwind) · SQLite · Pinecone/Chroma · deployed on EC2 + Vercel</text>
</svg>
